name: Build SPLEEX Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA \
              -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate CI release signing keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/spleex-upload.jks \
            -storepass spleexrelease2026 -alias upload -keypass spleexrelease2026 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SPLEEX,O=SPLEEX Social,C=US"

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PATH: /tmp/spleex-upload.jks
          STORE_PASSWORD: spleexrelease2026
          KEY_PASSWORD: spleexrelease2026
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPLEEX-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SPLEEX Latest Android APK
          body: |
            Download **app-release.apk** (recommended for Android phones) or **app-debug.apk**.
            Requires Android 7.0 (API 24) or higher.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
